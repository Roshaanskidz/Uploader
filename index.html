function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function statusDot(status){
  return status === 'live'
    ? `<span class="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-600 dark:text-emerald-400"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>Live</span>`
    : `<span class="inline-flex items-center gap-1 text-[11px] font-medium text-amber-600 dark:text-amber-400"><span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>Scheduled</span>`;
}

function render(filter=''){
  const wrap = document.getElementById('channels-wrap');
  const q = filter.trim().toLowerCase();
  let totalShown = 0;
  let html = '';

  channels.forEach(c => {
    const vids = uploads.filter(u => u.channel === c.name && (!q || u.title.toLowerCase().includes(q) || u.desc.toLowerCase().includes(q) || c.name.toLowerCase().includes(q)));
    if(vids.length === 0) return;
    totalShown += vids.length;

    html += `
      <div class="card rounded-lg overflow-hidden">
        <div class="flex items-center gap-3 px-4 py-3 border-b border-[#e4e7ec]" style="border-color:inherit">
          <img src="${c.pfp}" class="h-8 w-8 rounded-full object-cover" alt="${escapeHtml(c.name)}">
          <div class="flex-1 min-w-0">
            <p class="font-medium text-sm truncate">${escapeHtml(c.name)}</p>
          </div>
          <span class="subtle text-xs text-[#6b7280]">${vids.length} video${vids.length>1?'s':''}</span>
        </div>
        <div class="divide-y divide-[#e4e7ec]">
          ${vids.map(u => videoRow(u)).join('')}
        </div>
      </div>
    `;
  });

  wrap.innerHTML = html;
  document.getElementById('results-count').textContent = `${totalShown} video${totalShown!==1?'s':''}`;
  document.getElementById('no-results').classList.toggle('hidden', totalShown !== 0);

  wrap.querySelectorAll('.copy-title').forEach(b => b.addEventListener('click', () => copyText(b.dataset.text, 'Title copied')));
  wrap.querySelectorAll('.copy-desc').forEach(b => b.addEventListener('click', () => copyText(b.dataset.text, 'Description copied')));
}

function videoRow(u){
  return `
    <div class="px-4 py-3">
      <div class="flex items-center justify-between gap-2 mb-2">
        ${statusDot(u.status)}
      </div>
      <p class="text-sm font-medium leading-snug mb-2">${escapeHtml(u.title)}</p>
      <div class="flex gap-2">
        <button class="copy-title btn btn-primary rounded-md text-xs font-medium px-3 h-8" data-text="${escapeHtml(u.title)}">Copy Title</button>
        <button class="copy-desc btn btn-copy rounded-md text-xs font-medium px-3 h-8" data-text="${escapeHtml(u.desc)}">Copy Description</button>
      </div>
    </div>
  `;
}

function copyText(text, label){
  const ta = document.createElement('textarea');
  ta.value = text.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  showToast(label);
}

function showToast(msg){
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast card rounded-md px-3 py-2 text-sm shadow-lg flex items-center gap-2';
  t.innerHTML = `<span class="text-emerald-500">â</span> ${msg}`;
  wrap.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity .2s ease';
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 200);
  }, 1800);
}

document.getElementById('global-search').addEventListener('input', (e) => render(e.target.value));
document.getElementById('theme-toggle').addEventListener('click', () => document.documentElement.classList.toggle('dark'));

render();
</script>
