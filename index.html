<head>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --border: #e4e7ee;
  --text-primary: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --live-dot: #10b981;
  --live-text: #059669;
  --btn-bg: #f9fafb;
  --btn-border: #d1d5db;
  --btn-hover: #f3f4f6;
  --toast-bg: #ffffff;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.1);
  --r: 12px;
  --r-sm: 8px;
}

html.dark {
  --bg: #0f1117;
  --surface: #1a1d27;
  --border: #252836;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --live-dot: #34d399;
  --live-text: #34d399;
  --btn-bg: #252836;
  --btn-border: #334155;
  --btn-hover: #2d3148;
  --toast-bg: #1e2130;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 20px rgba(0,0,0,.4);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

/* NAVBAR */
.navbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.nav-inner {
  max-width: 900px; margin: 0 auto;
  padding: 0 16px; height: 58px;
  display: flex; align-items: center; gap: 12px;
}
.logo {
  display: flex; align-items: center; gap: 9px;
  font-weight: 700; font-size: 15px;
  color: var(--text-primary); text-decoration: none; flex-shrink: 0;
}
.logo-icon {
  width: 30px; height: 30px; border-radius: 7px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.logo-icon svg { width: 14px; height: 14px; fill: #fff; }

.search-box {
  flex: 1; position: relative; max-width: 300px; margin-left: auto;
}
.search-box svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none; flex-shrink: 0;
}
#search-input {
  width: 100%; height: 36px;
  padding: 0 12px 0 32px;
  font-size: 13px; font-family: inherit;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--bg); color: var(--text-primary);
  outline: none;
}
#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
#search-input::placeholder { color: var(--text-muted); }

#theme-btn {
  width: 36px; height: 36px; flex-shrink: 0;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--btn-bg); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
#theme-btn:hover { background: var(--btn-hover); }

/* MAIN */
main { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 10px;
}
.page-title { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
.count-badge {
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  background: var(--btn-bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 10px; white-space: nowrap;
}

/* CHANNEL CARDS */
.channels { display: flex; flex-direction: column; gap: 18px; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow);
}
.card-head {
  display: flex; align-items: center; gap: 11px;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.ch-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--btn-bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.ch-name { font-size: 13.5px; font-weight: 600; }
.ch-subs { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; }
.ch-count {
  margin-left: auto; font-size: 11.5px; font-weight: 600;
  color: var(--text-secondary); background: var(--btn-bg);
  border: 1px solid var(--border); border-radius: 20px; padding: 2px 9px;
  white-space: nowrap; flex-shrink: 0;
}

/* VIDEO ROWS */
.vrow {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.vrow:last-child { border-bottom: none; }

.live-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; color: var(--live-text);
  background: rgba(16,185,129,.1); border-radius: 20px;
  padding: 2px 8px; margin-bottom: 7px;
}
html.dark .live-badge { background: rgba(52,211,153,.1); }
.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--live-dot); animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.vtitle {
  font-size: 13.5px; font-weight: 500; line-height: 1.5;
  color: var(--text-primary); margin-bottom: 10px;
}

/* Description */
.desc-text {
  font-size: 12px; color: var(--text-secondary); line-height: 1.65;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; white-space: pre-wrap; word-break: break-word;
}
.desc-text.open { display: block; -webkit-line-clamp: unset; }
.desc-toggle {
  font-size: 11.5px; font-weight: 500; color: var(--accent);
  background: none; border: none; cursor: pointer;
  padding: 5px 0 10px; font-family: inherit; display: block;
}
.desc-toggle:hover { color: var(--accent-hover); }

/* Buttons */
.btn-row { display: flex; flex-wrap: wrap; gap: 7px; }
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12.5px; font-weight: 600; font-family: inherit;
  height: 34px; padding: 0 13px; border-radius: var(--r-sm);
  cursor: pointer; border: none; outline: none;
  transition: background .12s, transform .1s;
  white-space: nowrap; user-select: none; -webkit-user-select: none;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary {
  background: var(--btn-bg); color: var(--text-primary);
  border: 1px solid var(--btn-border);
}
.btn-secondary:hover { background: var(--btn-hover); }
.btn-ghost {
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--btn-hover); color: var(--text-primary); }

/* No results */
#no-results {
  display: none; text-align: center; padding: 56px 20px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--shadow);
}
#no-results .nr-icon { font-size: 34px; margin-bottom: 10px; }
#no-results .nr-title { font-size: 15px; font-weight: 600; }
#no-results .nr-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* Toast */
#toast-wrap {
  position: fixed; bottom: 22px; right: 18px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  background: var(--toast-bg); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 10px 15px;
  font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-md);
  display: flex; align-items: center; gap: 8px;
  animation: tin .18s ease both;
}
@keyframes tin { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

@media (max-width: 480px) {
  .search-box { max-width: none; }
  .nav-inner { padding: 0 12px; }
  main { padding: 18px 12px 60px; }
  .card-head { padding: 11px 12px; }
  .vrow { padding: 13px 12px; }
}
</style>
</head>

// Store raw strings by index — never put them in HTML attributes
var store = {};

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function render(q) {
  q = (q || "").trim().toLowerCase();
  var wrap = document.getElementById("channels");
  var html = "";
  var total = 0;

  channels.forEach(function(ch) {
    var vids = uploads.filter(function(u) {
      return u.ch === ch.name && (!q ||
        u.title.toLowerCase().indexOf(q) > -1 ||
        u.desc.toLowerCase().indexOf(q) > -1 ||
        ch.name.toLowerCase().indexOf(q) > -1
      );
    });
    if (!vids.length) return;
    total += vids.length;

    var rows = vids.map(function(u) {
      var idx = uploads.indexOf(u);
      store["t" + idx] = u.title;
      store["d" + idx] = u.desc;
      store["a" + idx] = u.title + "\n\n" + u.desc;

      var descId = "desc" + idx;
      return '<div class="vrow">' +
        '<span class="live-badge"><span class="live-dot"></span>Live</span>' +
        '<p class="vtitle">' + esc(u.title) + '</p>' +
        '<p class="desc-text" id="' + descId + '">' + esc(u.desc) + '</p>' +
        '<button class="desc-toggle" onclick="toggleDesc(' + idx + ')">Show more</button>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" onclick="doCopy(' + idx + ',\'t\')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy Title</button>' +
          '<button class="btn btn-secondary" onclick="doCopy(' + idx + ',\'d\')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Copy Desc</button>' +
          '<button class="btn btn-ghost" onclick="doCopy(' + idx + ',\'a\')">Copy All</button>' +
        '</div>' +
      '</div>';
    }).join("");

    html +=
      '<div class="card">' +
        '<div class="card-head">' +
          '<div class="ch-avatar">' + ch.emoji + '</div>' +
          '<div><div class="ch-name">' + esc(ch.name) + '</div>' +
          '<div class="ch-subs">' + ch.subs + ' subscribers</div></div>' +
          '<span class="ch-count">' + vids.length + ' video' + (vids.length > 1 ? "s" : "") + '</span>' +
        '</div>' +
        rows +
      '</div>';
  });

  wrap.innerHTML = html;
  document.getElementById("count-badge").textContent = total + " video" + (total !== 1 ? "s" : "");
  document.getElementById("no-results").style.display = total === 0 ? "block" : "none";
}

function toggleDesc(idx) {
  var el = document.getElementById("desc" + idx);
  var btn = el.nextElementSibling;
  var open = el.classList.toggle("open");
  btn.textContent = open ? "Show less" : "Show more";
}

function doCopy(idx, type) {
  var text = store[type + idx] || "";
  var labels = { t: "Title copied!", d: "Description copied!", a: "All copied!" };
  var icons  = { t: "✅", d: "📋", a: "🎉" };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      toast(icons[type], labels[type]);
    }).catch(function() { fallbackCopy(text, icons[type], labels[type]); });
  } else {
    fallbackCopy(text, icons[type], labels[type]);
  }
}

function fallbackCopy(text, icon, label) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;left:-9999px;top:-9999px;opacity:0;font-size:16px";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand("copy"); toast(icon, label); } catch(e) {}
  document.body.removeChild(ta);
}

function toast(icon, msg) {
  var wrap = document.getElementById("toast-wrap");
  var t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = "<span>" + icon + "</span>" + msg;
  wrap.appendChild(t);
  setTimeout(function() {
    t.style.transition = "opacity .2s, transform .2s";
    t.style.opacity = "0";
    t.style.transform = "translateY(6px)";
    setTimeout(function() { t.remove(); }, 220);
  }, 1800);
}

// Search
document.getElementById("search-input").addEventListener("input", function() {
  render(this.value);
});

// Theme toggle — HTML already has class="dark" so dark is default
document.getElementById("theme-btn").addEventListener("click", function() {
  var isDark = document.documentElement.classList.toggle("dark");
  try { localStorage.setItem("nx-theme", isDark ? "dark" : "light"); } catch(e) {}
});

// Restore preference only if user explicitly chose light before
try {
  if (localStorage.getItem("nx-theme") === "light") {
    document.documentElement.classList.remove("dark");
  }
} catch(e) {}

render();
</script>
</body>
</html>
