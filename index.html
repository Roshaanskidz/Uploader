  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --border: #e4e7ee;
    --text-primary: #111827;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef2ff;
    --live-dot: #10b981;
    --live-text: #059669;
    --btn-copy-bg: #f9fafb;
    --btn-copy-border: #d1d5db;
    --btn-copy-hover: #f3f4f6;
    --toast-bg: #ffffff;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.1);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html.dark {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #252836;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --accent-soft: #1e1b4b;
    --live-dot: #34d399;
    --live-text: #34d399;
    --btn-copy-bg: #252836;
    --btn-copy-border: #334155;
    --btn-copy-hover: #2d3148;
    --toast-bg: #1e2130;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
    --shadow-md: 0 4px 20px rgba(0,0,0,.4);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    transition: background .25s, color .25s;
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAVBAR ── */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow-sm);
  }

  .navbar-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.3px;
    color: var(--text-primary);
    text-decoration: none;
    flex-shrink: 0;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { width: 16px; height: 16px; fill: #fff; }

  .navbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: flex-end;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 280px;
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  #global-search {
    width: 100%;
    height: 36px;
    padding: 0 12px 0 32px;
    font-size: 13px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text-primary);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  #global-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,.15);
  }

  #global-search::placeholder { color: var(--text-muted); }

  #theme-toggle {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--btn-copy-bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    transition: background .15s;
  }

  #theme-toggle:hover { background: var(--btn-copy-hover); }

  /* ── MAIN ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.4px;
  }

  .results-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--btn-copy-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    white-space: nowrap;
  }

  /* ── MOBILE SEARCH ── */
  .mobile-search {
    display: none;
    margin-bottom: 20px;
  }

  @media (max-width: 520px) {
    .search-wrap { display: none; }
    .mobile-search { display: block; }
    .mobile-search .search-wrap {
      display: block;
      max-width: 100%;
    }
    .mobile-search #global-search-mobile {
      width: 100%;
      height: 40px;
      padding: 0 12px 0 36px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-primary);
      outline: none;
    }
    .mobile-search #global-search-mobile:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    .mobile-search #global-search-mobile::placeholder { color: var(--text-muted); }
  }

  /* ── CHANNEL CARDS ── */
  .channels-wrap { display: flex; flex-direction: column; gap: 20px; }

  .channel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .2s;
  }

  .channel-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .channel-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    border: 2px solid var(--border);
  }

  .channel-meta { flex: 1; min-width: 0; }

  .channel-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .channel-subs {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .channel-count {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--btn-copy-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 9px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── VIDEO ROWS ── */
  .video-list { }

  .video-row {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }

  .video-row:last-child { border-bottom: none; }
  .video-row:hover { background: var(--bg); }

  .video-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--live-text);
    background: rgba(16,185,129,.1);
    border-radius: 20px;
    padding: 3px 8px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  html.dark .live-badge { background: rgba(52,211,153,.1); }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--live-dot);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }

  .video-title {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text-primary);
    flex: 1;
  }

  /* ── DESCRIPTION TOGGLE ── */
  .desc-wrap { margin-bottom: 12px; }

  .desc-text {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: all .2s;
  }

  .desc-text.expanded {
    display: block;
    -webkit-line-clamp: unset;
  }

  .desc-toggle {
    font-size: 11.5px;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0 0;
    font-family: inherit;
    font-weight: 500;
  }

  .desc-toggle:hover { color: var(--accent-hover); }

  /* ── ACTION BUTTONS ── */
  .action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    height: 34px;
    padding: 0 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: none;
    outline: none;
    transition: background .15s, transform .1s, box-shadow .15s;
    white-space: nowrap;
    user-select: none;
  }

  .btn:active { transform: scale(.97); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: var(--btn-copy-bg);
    color: var(--text-primary);
    border: 1px solid var(--btn-copy-border);
  }

  .btn-secondary:hover { background: var(--btn-copy-hover); }

  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 0 10px;
  }

  .btn-ghost:hover { background: var(--btn-copy-hover); color: var(--text-primary); }

  /* ── THUMBNAIL ── */
  .thumb-wrap {
    width: 72px;
    height: 40px;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ── NO RESULTS ── */
  #no-results {
    display: none;
    text-align: center;
    padding: 60px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }

  #no-results .no-icon { font-size: 36px; margin-bottom: 12px; }
  #no-results .no-title { font-size: 16px; font-weight: 600; }
  #no-results .no-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

  /* ── TOAST ── */
  #toast-wrap {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }

  .toast {
    background: var(--toast-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: toastIn .2s ease both;
    min-width: 160px;
  }

  .toast-icon { font-size: 15px; }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    main { padding: 20px 14px 60px; }
    .navbar-inner { padding: 0 14px; }
    .video-row { padding: 14px; }
    .channel-header { padding: 12px 14px; }
    .btn { height: 36px; font-size: 13px; padding: 0 13px; }
  }

  @media (max-width: 380px) {
    .action-row { gap: 6px; }
    .btn { padding: 0 10px; font-size: 12px; height: 34px; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
</style>
</head>

// ── THUMBNAIL DATA ──
// Replace ZOO_THUMB_SRC with the actual hosted YouTube thumbnail URL when available.
const ZOO_THUMB_SRC = '';

// ── HELPERS ──
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function rawText(s){ return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'); }

function liveBadge(){
  return `<span class="live-badge"><span class="live-dot"></span>Live</span>`;
}

// ── RENDER ──
function render(filter){
  const q = (filter||'').trim().toLowerCase();
  const wrap = document.getElementById('channels-wrap');
  let totalShown = 0;
  let html = '';

  channels.forEach(ch => {
    const vids = uploads.filter(u =>
      u.channel === ch.name &&
      (!q || u.title.toLowerCase().includes(q) || u.desc.toLowerCase().includes(q) || ch.name.toLowerCase().includes(q))
    );

    if(!vids.length) return;
    totalShown += vids.length;

    html += `
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-avatar">${ch.emoji}</div>
          <div class="channel-meta">
            <div class="channel-name">${esc(ch.name)}</div>
            <div class="channel-subs">${ch.subs} subscribers</div>
          </div>
          <span class="channel-count">${vids.length} video${vids.length>1?'s':''}</span>
        </div>
        <div class="video-list">
          ${vids.map((u,i) => videoRow(u, ch.name+'-'+i)).join('')}
        </div>
      </div>
    `;
  });

  wrap.innerHTML = html;

  // Update count badge
  document.getElementById('results-count').textContent = `${totalShown} video${totalShown!==1?'s':''}`;

  // Show/hide no-results
  document.getElementById('no-results').style.display = totalShown === 0 ? 'block' : 'none';

  // Attach events
  wrap.querySelectorAll('.copy-title').forEach(b => {
    b.addEventListener('click', () => {
      copyText(b.dataset.text);
      showToast('✅', 'Title copied!');
    });
  });
  wrap.querySelectorAll('.copy-desc').forEach(b => {
    b.addEventListener('click', () => {
      copyText(b.dataset.text);
      showToast('📋', 'Description copied!');
    });
  });
  wrap.querySelectorAll('.copy-all').forEach(b => {
    b.addEventListener('click', () => {
      copyText(b.dataset.text);
      showToast('🎉', 'All copied!');
    });
  });
  wrap.querySelectorAll('.desc-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const descEl = document.getElementById(btn.dataset.target);
      const expanded = descEl.classList.toggle('expanded');
      btn.textContent = expanded ? 'Show less' : 'Show more';
    });
  });
}

function videoRow(u, uid){
  const descId = 'desc-' + uid.replace(/\s/g,'-');
  const allText = u.title + '\n\n' + u.desc;
  const thumb = '';

  return `
    <div class="video-row">
      <div class="video-top">
        ${thumb}
        <div style="flex:1;min-width:0;">
          ${liveBadge()}
          <p class="video-title" style="margin-top:6px;">${esc(u.title)}</p>
        </div>
      </div>
      <div class="desc-wrap">
        <p class="desc-text" id="${descId}">${esc(u.desc)}</p>
        <button class="desc-toggle" data-target="${descId}">Show more</button>
      </div>
      <div class="action-row">
        <button class="btn btn-primary copy-title" data-text="${esc(u.title)}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy Title
        </button>
        <button class="btn btn-secondary copy-desc" data-text="${esc(u.desc)}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Copy Description
        </button>
        <button class="btn btn-ghost copy-all" data-text="${esc(allText)}">Copy All</button>
      </div>
    </div>
  `;
}

// ── COPY ──
async function copyText(raw){
  const text = rawText(raw);
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      // Fallback for older browsers
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  } catch(e){
    console.warn('Copy failed:', e);
  }
}

// ── TOAST ──
function showToast(icon, msg){
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="toast-icon">${icon}</span>${msg}`;
  wrap.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity .2s ease, transform .2s ease';
    t.style.opacity = '0';
    t.style.transform = 'translateY(6px)';
    setTimeout(() => t.remove(), 220);
  }, 1800);
}

// ── SEARCH (desktop + mobile) ──
const searchDesktop = document.getElementById('global-search');
const searchMobile  = document.getElementById('global-search-mobile');

function onSearch(e){ render(e.target.value); }
searchDesktop.addEventListener('input', onSearch);
searchMobile.addEventListener('input', (e) => {
  searchDesktop.value = e.target.value;
  render(e.target.value);
});

// ── THEME ── (dark by default always)
(function(){
  const saved = localStorage.getItem('nx-theme');
  if(saved !== 'light'){
    document.documentElement.classList.add('dark');
  }
})();

document.getElementById('theme-toggle').addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('nx-theme', isDark ? 'dark' : 'light');
});

// ── INIT ──
render();
</script>
